services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: server/.env
    environment:
      API_PORT: "5000"
      MCP_PORT: "8081"
    ports:
      - "5000:5000"
      - "8081:8081"
    volumes:
      - wiki-storage:/app/server/storage
      - wiki-uploads:/app/server/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./ui-apple
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  wiki-storage:
  wiki-uploads:
