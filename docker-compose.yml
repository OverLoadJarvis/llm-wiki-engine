services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: server/.env
    environment:
      API_PORT: "5000"
      MCP_PORT: "8081"
    # 不对外映射端口：API / MCP 仅经 frontend nginx 统一入口访问
    expose:
      - "5000"
      - "8081"
    volumes:
      - wiki-storage:/app/server/storage
      - wiki-uploads:/app/server/uploads
      # Agent 与 MCP 共享投递目录：宿主机 ./inbox ↔ 容器 /data/inbox
      - ./inbox:/data/inbox
    restart: unless-stopped

  frontend:
    build:
      context: ./ui-apple
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  wiki-storage:
  wiki-uploads:
